<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小野めぐり珈琲バッグ デジタルパスポート（DB連携版）</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDK (v9 Modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, getDocs, arrayUnion, Timestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAcLiObsI5p_dpGfpERStBHx2J322sO95U",
  authDomain: "ono-coffee-passport.firebaseapp.com",
  projectId: "ono-coffee-passport",
  storageBucket: "ono-coffee-passport.firebasestorage.app",
  messagingSenderId: "537440513359",
  appId: "1:537440513359:web:973793d14ff9b6e382693a",
  measurementId: "G-585ENGFG8G"
};

        // Firebase初期化
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 現在のセッションコード
        let currentCode = new URLSearchParams(window.location.search).get('code') || localStorage.getItem('active_bag_code');

        window.addEventListener('DOMContentLoaded', async () => {
            if (currentCode) {
                localStorage.setItem('active_bag_code', currentCode);
                await checkAndInitPass(currentCode); // スペル修正済み
            } else {
                showView('not-activated-view');
            }
        });

        // パスポートの有効性確認 & 初期化
        async function checkAndInitPass(code) {
            showView('loading-view');
            try {
                const docRef = doc(db, "codes", code);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    renderDashboard(data);
                } else {
                    const now = new Date();
                    const expires = new Date();
                    expires.setMonth(expires.getMonth() + 3);

                    const initialData = {
                        code: code,
                        activated_at: Timestamp.fromDate(now),
                        expires_at: Timestamp.fromDate(expires),
                        used_stores: []
                    };

                    await setDoc(docRef, initialData);
                    alert('珈琲バッグのパスポートが有効化されました！');
                    renderDashboard(initialData);
                }
            } catch (error) {
                console.error("Error checking pass:", error);
                alert('データの読み込みに失敗しました。');
                showView('not-activated-view');
            }
        }

        // ダッシュボード描画
        async function renderDashboard(passData) {
            showView('activated-view');
            
            const expireDate = passData.expires_at.toDate().toLocaleDateString();
            document.getElementById('expire-date').innerText = `有効期限: ${expireDate} まで`;

            const storesSnapshot = await getDocs(collection(db, "stores"));
            const storeListEl = document.getElementById('store-list');
            storeListEl.innerHTML = '';

            const usedStores = passData.used_stores || [];
            const historyListEl = document.getElementById('history-list');
            historyListEl.innerHTML = '';

            if (usedStores.length === 0) {
                historyListEl.innerHTML = `<p class="text-xs text-gray-400 text-center py-4">まだ利用した店舗はありません。</p>`;
            }

            storesSnapshot.forEach((storeDoc) => {
                const store = storeDoc.data();
                const storeId = storeDoc.id;
                const isUsed = usedStores.includes(storeId);

                const card = document.createElement('div');
                card.className = `bg-white rounded-xl p-4 shadow-sm border ${isUsed ? 'border-gray-200 opacity-75' : 'border-amber-100'}`;
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <h3 class="font-bold text-gray-800">${store.name}</h3>
                        ${isUsed ? `<span class="text-xs bg-gray-200 text-gray-600 px-2 py-1 rounded font-bold">利用済み</span>` : `<span class="text-xs bg-amber-100 text-amber-800 px-2 py-1 rounded font-bold">利用可能</span>`}
                    </div>
                    <p class="text-xs text-gray-500 mb-2">📍 ${store.address} / 🕒 ${store.hours}</p>
                    <div class="bg-amber-50 p-2.5 rounded-lg text-xs text-amber-900 mb-3">
                        🎁 <strong>特典:</strong> ${store.benefit}
                    </div>
                    ${isUsed 
                        ? `<button disabled class="w-full bg-gray-200 text-gray-400 font-bold py-2 rounded-lg text-sm cursor-not-allowed">利用済みです</button>`
                        : `<button onclick="useStoreCoupon('${currentCode}', '${storeId}', '${store.name}')" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-2 rounded-lg text-sm shadow transition">特典を利用する</button>`
                    }
                `;
                storeListEl.appendChild(card);

                if (isUsed) {
                    const historyItem = document.createElement('div');
                    historyItem.className = 'flex justify-between items-center bg-gray-50 p-2.5 rounded-lg text-xs';
                    historyItem.innerHTML = `
                        <div class="font-bold text-gray-800">${store.name}</div>
                        <span class="text-green-600 font-bold">✓ 利用済み</span>
                    `;
                    historyListEl.appendChild(historyItem);
                }
            });
        }

        // クーポン利用（消込）
        window.useStoreCoupon = async function(code, storeId, storeName) {
            if (confirm(`【${storeName}】の特典を利用しますか？`)) {
                try {
                    const docRef = doc(db, "codes", code);
                    await updateDoc(docRef, {
                        used_stores: arrayUnion(storeId)
                    });
                    alert(`${storeName}の特典を利用済みにしました！`);
                    window.location.reload();
                } catch (error) {
                    console.error("Error updating coupon:", error);
                    alert('処理に失敗しました。');
                }
            }
        };

        // テスト用アクティベート
        window.testActivate = function() {
            const randomCode = 'bag-' + Math.random().toString(36).substring(2, 8);
            window.location.href = `?code=${randomCode}`;
        };

        function showView(viewId) {
            ['not-activated-view', 'loading-view', 'activated-view'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(viewId).classList.remove('hidden');
        }
    </script>
</head>
<body class="bg-amber-50 text-gray-800 font-sans min-h-screen flex flex-col">

    <header class="bg-amber-800 text-white p-4 shadow-md text-center">
        <h1 class="text-xl font-bold">☕ 小野めぐり珈琲バッグ</h1>
        <p class="text-xs text-amber-200 mt-1">デジタルパスポート（DB連携版）</p>
    </header>

    <main class="flex-1 max-w-md w-full mx-auto p-4 pb-20">

        <!-- 未有効化 -->
        <section id="not-activated-view" class="bg-white rounded-xl p-6 shadow-sm text-center mt-6 hidden">
            <h2 class="text-lg font-bold text-gray-800 mb-2">パスポートが未有効化です</h2>
            <p class="text-sm text-gray-600 mb-4">珈琲バッグのQRコードを読み取るか、テストボタンを押してください。</p>
            <button onclick="testActivate()" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-3 px-4 rounded-lg shadow transition">
                【テスト】新規コードで有効化する
            </button>
        </section>

        <!-- ローディング -->
        <section id="loading-view" class="text-center py-20 hidden">
            <p class="text-amber-800 font-bold">データを読み込んでいます...</p>
        </section>

        <!-- 有効化済み -->
        <section id="activated-view" class="hidden">
            <div class="bg-white rounded-xl p-4 shadow-sm mb-4 border-l-4 border-amber-600">
                <div class="flex justify-between items-center mb-1">
                    <span class="text-xs font-bold text-amber-700 bg-amber-100 px-2 py-0.5 rounded">クラウド同期中</span>
                    <span id="expire-date" class="text-xs text-gray-500"></span>
                </div>
                <div class="text-sm font-medium text-gray-700">状態: <span class="text-green-600 font-bold">全店舗利用可能（各1回）</span></div>
            </div>

            <div class="flex bg-amber-200 rounded-lg p-1 mb-4">
                <button onclick="document.getElementById('tab-stores').classList.remove('hidden'); document.getElementById('tab-history').classList.add('hidden');" class="flex-1 py-2 text-sm font-bold rounded-md bg-white shadow-sm">参加店舗一覧</button>
                <button onclick="document.getElementById('tab-stores').classList.add('hidden'); document.getElementById('tab-history').classList.remove('hidden');" class="flex-1 py-2 text-sm font-bold rounded-md">利用履歴</button>
            </div>

            <div id="tab-stores" class="space-y-3">
                <div id="store-list" class="space-y-3"></div>
            </div>

            <div id="tab-history" class="hidden space-y-3">
                <div class="bg-white rounded-xl p-4 shadow-sm">
                    <h3 class="font-bold text-sm text-gray-700 mb-3 border-b pb-2">これまでに利用したお店</h3>
                    <div id="history-list" class="space-y-2"></div>
                </div>
            </div>
        </section>

    </main>

    <footer class="bg-white border-t py-3 text-center text-xs text-gray-500">
        &copy; 小野めぐり珈琲バッグ実行委員会
    </footer>

</body>
</html>
